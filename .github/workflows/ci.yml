name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test
        run: uv run --locked pytest
      - name: Verify version metadata
        run: uv run --locked python scripts/check_version.py
      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked detect-secrets scan --all-files \
            --exclude-files '^(\.git|\.venv|\.pytest_cache|\.ruff_cache)/' > /tmp/detect-secrets.json
          uv run --locked python - <<'PY'
          import json
          results = json.load(open("/tmp/detect-secrets.json"))["results"]
          if results:
              raise SystemExit(f"secret scan findings: {sorted(results)}")
          PY

  compatibility:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant:
          - "2026.7.0"
          - "2026.9.3"
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Test fully resolved exact runtime
        run: python scripts/test_runtime.py "${{ matrix.homeassistant }}"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-07-21

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-07-19
        with:
          category: integration
          comment: false
      - name: Verify reviewed license file
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test -f LICENSE
          grep -qx 'MIT License' LICENSE

  package:
    name: Package exact commit
    needs:
      - test
      - compatibility
      - hassfest
      - hacs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Build review artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${COMMIT_SHA}")"
          export SOURCE_DATE_EPOCH
          python scripts/build_release.py --label "${COMMIT_SHA}"
          (cd dist && sha256sum -c "wait_for_wolt-${COMMIT_SHA}.sha256")
          (cd dist && sha256sum -c wait_for_wolt.sha256)
          cmp "dist/wait_for_wolt-${COMMIT_SHA}.zip" dist/wait_for_wolt.zip
          printf 'commit=%s\n' "${COMMIT_SHA}" > "dist/wait_for_wolt-${COMMIT_SHA}.metadata"
          python -m zipfile -l "dist/wait_for_wolt-${COMMIT_SHA}.zip"
      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wait_for_wolt-${{ env.COMMIT_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
