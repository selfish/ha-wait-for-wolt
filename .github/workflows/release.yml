name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to point at main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.25
      - name: Install locked development dependencies
        run: uv sync --frozen
      - name: Verify tag and version metadata
        run: uv run python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
      - name: Lint, format, and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Test declared and current Home Assistant versions
        shell: bash
        run: |
          set -euo pipefail
          for version in 2026.7.0 2026.7.4; do
            uv pip install --no-deps "homeassistant==${version}"
            uv run pytest
          done
      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          uv run detect-secrets scan --all-files \
            --exclude-files '^(\.git|\.venv|\.pytest_cache|\.ruff_cache)/' > /tmp/detect-secrets.json
          uv run python - <<'PY'
          import json
          results = json.load(open("/tmp/detect-secrets.json"))["results"]
          if results:
              raise SystemExit(f"secret scan findings: {sorted(results)}")
          PY
      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master, 2026-07-21
      - name: Validate HACS repository without ignores
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-07-19
        with:
          category: integration
          comment: false
      - name: Build and inspect release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(uv run python scripts/check_version.py --tag "${GITHUB_REF_NAME}")"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv run python scripts/build_release.py --label "${VERSION}"
          (cd dist && sha256sum -c "wait_for_wolt-${VERSION}.sha256")
          (cd dist && sha256sum -c wait_for_wolt.sha256)
          cmp "dist/wait_for_wolt-${VERSION}.zip" dist/wait_for_wolt.zip
          printf 'version=%s\ncommit=%s\n' \
            "${VERSION}" "$(git rev-parse HEAD)" > "dist/wait_for_wolt-${VERSION}.metadata"
          python -m zipfile -l "dist/wait_for_wolt-${VERSION}.zip"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(uv run python scripts/check_version.py --tag "${GITHUB_REF_NAME}")"
          prerelease=()
          case "${VERSION}" in
            *a*|*b*|*rc*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            "dist/wait_for_wolt.zip" \
            "dist/wait_for_wolt.sha256" \
            "dist/wait_for_wolt-${VERSION}.zip" \
            "dist/wait_for_wolt-${VERSION}.sha256" \
            "dist/wait_for_wolt-${VERSION}.metadata" \
            --verify-tag \
            --title "Wait for Wolt ${VERSION}" \
            --generate-notes \
            "${prerelease[@]}"
